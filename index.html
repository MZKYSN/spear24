<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#101925"><title>SPEAR 24</title><style>*{box-sizing:border-box}body{margin:0;background:#101925;color:white;font-family:system-ui;display:grid;place-items:center;min-height:100dvh;overflow:hidden;user-select:none}main{position:relative;width:min(100vw,222.22dvh);aspect-ratio:20/9}canvas{width:100%;height:100%;display:block;touch-action:none}button{background:#dce7f4;color:#152131;border:0;border-radius:7px;padding:.65em 1.4em;font-weight:bold;font-size:clamp(10px,2vw,20px);touch-action:manipulation}#bar{position:absolute;bottom:5%;left:0;right:0;display:flex;justify-content:center;gap:12px}#hint{display:none;position:fixed;bottom:5%;font-size:12px;color:#aabbd1}@media(orientation:portrait){#hint{display:block}}</style></head><body><main><canvas id="game" width="1000" height="450"></canvas><div id="bar"></div></main><div id="hint">スマートフォンを横向きにしてください</div><script>
'use strict';const c=document.getElementById('game'),g=c.getContext('2d'),bar=document.getElementById('bar');const W=1000,H=450,WW=2400,HH=1080,R=17,D=34;const skins=[['DEFAULT','#60a5fa'],['SAMURAI','#bd424d'],['KNIGHT','#a8b5c4'],['NEON','#23d6b5'],['GOLD','#e5b94b'],['SHADOW','#555567']];let scene='login',settings=false,skin=0,units=[],field={x:0,y:0,w:WW,h:HH},elapsed=0,last=performance.now(),result=null,keys={},joy={x:0,y:0,id:null},effects=[];const move={x:100,y:350,r:72},dash={x:785,y:370,r:44},atk={x:915,y:325,r:57};
function button(label,fn){let b=document.createElement('button');b.textContent=label;b.onclick=fn;bar.appendChild(b)}function ui(){bar.replaceChildren();if(scene==='login'){if(settings)button('CLOSE',()=>{settings=false;ui()});else{button('LOGIN / GUEST',()=>{scene='skin';ui()});button('⚙ SETTING',()=>{settings=true;ui()})}}else if(scene==='skin'){button('◀',()=>skin=(skin+5)%6);button('PLAY',start);button('▶',()=>skin=(skin+1)%6)}else if(result)button('PLAY AGAIN',()=>{scene='skin';result=null;ui()})}
function start(){units=[];elapsed=0;result=null;effects=[];field={x:0,y:0,w:WW,h:HH};joy={x:0,y:0,id:null};keys={};for(let i=0;i<24;i++){let x=WW/2,y=HH/2;if(i){do{x=80+Math.random()*(WW-160);y=80+Math.random()*(HH-160)}while(units.some(u=>Math.hypot(x-u.x,y-u.y)<125))}units.push({x,y,a:Math.random()*Math.PI*2,vx:0,vy:0,alive:true,attack:0,queue:false,boost:0,cd:0,k:0,style:i?Math.floor(Math.random()*6):skin})}scene='play';ui()}
function hit(u){if(u.attack>0)u.queue=true;else u.attack=.2}function sprint(u){if(u.cd<=0){u.cd=5;u.boost=.5}}function length(u){return D*(1+.5*Math.sin(Math.PI*Math.max(0,u.attack)/.2))}function tip(u){let l=R+length(u);return{x:u.x+Math.cos(u.a)*l,y:u.y+Math.sin(u.a)*l}}function shaft(u){return [{x:u.x+Math.cos(u.a)*R,y:u.y+Math.sin(u.a)*R},tip(u)]}function cross(a,b,c,d){return a*d-b*c}function clash(a,b,c,d){let x=b.x-a.x,y=b.y-a.y,u=d.x-c.x,v=d.y-c.y,z=cross(x,y,u,v);if(Math.abs(z)<.0001)return false;let p=c.x-a.x,q=c.y-a.y,t=cross(p,q,u,v)/z,s=cross(p,q,x,y)/z;return t>=0&&t<=1&&s>=0&&s<=1}
function ai(u,dt){let target=null,best=Infinity;for(let v of units){if(v===u||!v.alive)continue;let d=Math.hypot(v.x-u.x,v.y-u.y);if(d<best){best=d;target=v}}if(!target)return[0,0];let a=Math.atan2(target.y-u.y,target.x-u.x)+Math.sin(elapsed*2+u.style*1.9)*.6;if(best<120&&Math.random()<dt*4)hit(u);if(best>170&&best<350&&Math.random()<dt*.6)sprint(u);return[Math.cos(a),Math.sin(a)]}
function update(dt){elapsed+=dt;let s=1-.86*Math.min(1,Math.max(0,(elapsed-20)/145));field.w=WW*s;field.h=HH*s;field.x=(WW-field.w)/2;field.y=(HH-field.h)/2;for(let i=0;i<units.length;i++){let u=units[i];if(!u.alive)continue;u.attack=Math.max(0,u.attack-dt);if(u.attack===0&&u.queue){u.attack=.2;u.queue=false}u.cd=Math.max(0,u.cd-dt);u.boost=Math.max(0,u.boost-dt);let x,y;if(i===0){x=+(!!(keys.d||keys.arrowright))-+(!!(keys.a||keys.arrowleft))+joy.x;y=+(!!(keys.s||keys.arrowdown))-+(!!(keys.w||keys.arrowup))+joy.y}else [x,y]=ai(u,dt);let m=Math.hypot(x,y);if(m>.08){let a=Math.atan2(y,x),d=Math.atan2(Math.sin(a-u.a),Math.cos(a-u.a));u.a+=Math.max(-9*dt,Math.min(9*dt,d))}let speed=150*Math.min(1,m)*(u.boost>0?2.5:1);u.x+=(Math.cos(u.a)*speed+u.vx)*dt;u.y+=(Math.sin(u.a)*speed+u.vy)*dt;u.vx*=Math.exp(-7*dt);u.vy*=Math.exp(-7*dt)}let dead=new Map();for(let i=0;i<units.length;i++){let a=units[i];if(!a.alive)continue;for(let j=i+1;j<units.length;j++){let b=units[j];if(!b.alive)continue;let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.001;if(d>150)continue;let nx=dx/d,ny=dy/d,ta=tip(a),tb=tip(b);if(clash(...shaft(a),...shaft(b))||Math.hypot(ta.x-tb.x,ta.y-tb.y)<6){a.vx=-nx*280;a.vy=-ny*280;b.vx=nx*280;b.vy=ny*280;effects.push({x:(ta.x+tb.x)/2,y:(ta.y+tb.y)/2,t:.2});continue}if(Math.hypot(ta.x-b.x,ta.y-b.y)<R&&!dead.has(b))dead.set(b,a);if(Math.hypot(tb.x-a.x,tb.y-a.y)<R&&!dead.has(a))dead.set(a,b);if(d<2*R){let p=(2*R-d)/2;a.x-=nx*p;a.y-=ny*p;b.x+=nx*p;b.y+=ny*p}}}for(let [u,k] of dead){u.alive=false;k.k++;effects.push({x:u.x,y:u.y,t:.5})}for(let u of units){if(!u.alive)continue;let x=u.x,y=u.y;u.x=Math.max(field.x+R,Math.min(field.x+field.w-R,u.x));u.y=Math.max(field.y+R,Math.min(field.y+field.h-R,u.y));if(x!==u.x)u.vx=Math.sign(u.x-x)*120;if(y!==u.y)u.vy=Math.sign(u.y-y)*120}effects=effects.filter(e=>(e.t-=dt)>0);let alive=units.filter(u=>u.alive).length;if(!units[0].alive)result={title:'ELIMINATED',rank:'#'+(alive+1)};else if(alive===1)result={title:'VICTORY',rank:'#1'};else if(elapsed>=180)result={title:'TIME UP',rank:alive+' SURVIVORS'};if(result)ui()}
function circle(x,y,r,color){g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fillStyle=color;g.fill()}function txt(s,x,y,size=20,col='#fff',align='center'){g.fillStyle=col;g.font='bold '+size+'px system-ui';g.textAlign=align;g.fillText(s,x,y)}function fighter(u,scale=1){g.save();g.translate(u.x,u.y);g.rotate(u.a);g.scale(scale,scale);circle(0,0,R,skins[u.style][1]);g.strokeStyle='#dce8f5';g.lineWidth=1.3;g.stroke();if(u.style){g.strokeStyle=u.style===5?'#ef777b':'#e6edf6';g.lineWidth=2;g.beginPath();g.moveTo(-9,-9);g.lineTo(7,0);g.lineTo(-9,9);g.stroke()}let l=length(u);g.fillStyle=u.attack>0?'#ffe199':u.style===4?'#f5d98a':'#e2e8f0';g.fillRect(R,-2.5,l-10,5);g.beginPath();g.moveTo(R+l-11,-6);g.lineTo(R+l,0);g.lineTo(R+l-11,6);g.fill();g.restore()}
function draw(){g.fillStyle='#152131';g.fillRect(0,0,W,H);if(scene==='login'){fighter({x:455,y:105,a:-.25,style:0,attack:0},2);txt('S P E A R  2 4',500,230,65);txt('24 FIGHTERS. ONE SURVIVOR.',500,280,20,'#aabbd1');if(settings){g.fillStyle='#0b1320dd';g.fillRect(0,0,W,H);g.fillStyle='#304155';g.fillRect(230,75,540,275);txt('SETTING',500,150,35);txt('COMING SOON',500,245,25,'#aabbd1')}return}if(scene==='skin'){txt('SELECT YOUR SKIN',500,55,30);fighter({x:455,y:205,a:-.3,style:skin,attack:0},4);txt(skins[skin][0],500,335,30);txt((skin+1)+' / 6',500,365,18,'#94a3b8');return}let p=units[0],cx=p.x-W/2,cy=p.y-H/2;g.fillStyle='#493340';g.fillRect(0,0,W,H);g.save();g.translate(-cx,-cy);g.fillStyle='#27394b';g.fillRect(field.x,field.y,field.w,field.h);g.save();g.beginPath();g.rect(field.x,field.y,field.w,field.h);g.clip();g.strokeStyle='#ffffff0b';g.lineWidth=1;g.beginPath();for(let x=Math.floor(cx/50)*50;x<cx+W;x+=50){g.moveTo(x,cy);g.lineTo(x,cy+H)}for(let y=Math.floor(cy/50)*50;y<cy+H;y+=50){g.moveTo(cx,y);g.lineTo(cx+W,y)}g.stroke();g.restore();g.strokeStyle='#f87171';g.lineWidth=4;g.strokeRect(field.x,field.y,field.w,field.h);for(let u of units){if(!u.alive)continue;if(u===p){circle(u.x,u.y,R+7,'#67b6fc66');g.strokeStyle='#67b6fc';g.stroke()}if(u.boost>0)circle(u.x-Math.cos(u.a)*25,u.y-Math.sin(u.a)*25,R,'#a7d6ff33');fighter(u)}for(let e of effects){g.beginPath();g.arc(e.x,e.y,10+(1-e.t)*20,0,Math.PI*2);g.strokeStyle='#ffe199';g.stroke()}g.restore();let mx=14,my=12,mw=200,mh=90;g.fillStyle='#101925dd';g.fillRect(mx,my,mw,mh);g.strokeStyle='#8196ad';g.strokeRect(mx,my,mw,mh);g.strokeStyle='#f87171';g.strokeRect(mx+field.x/WW*mw,my+field.y/HH*mh,field.w/WW*mw,field.h/HH*mh);g.save();g.beginPath();g.rect(mx,my,mw,mh);g.clip();g.strokeStyle='#93c5fd';g.strokeRect(mx+cx/WW*mw,my+cy/HH*mh,W/WW*mw,H/HH*mh);for(let u of units)if(u.alive)circle(mx+u.x/WW*mw,my+u.y/HH*mh,u===p?4:2.6,u===p?'#60a5fa':'#f87171');g.restore();txt('ALIVE '+units.filter(u=>u.alive).length+' / 24',14,124,17,'#fff','left');let t=Math.max(0,Math.ceil(180-elapsed));txt(Math.floor(t/60)+':'+String(t%60).padStart(2,'0'),500,35,30);txt('KILLS '+p.k,980,30,22,'#fff','right');circle(move.x,move.y,move.r,'#111c2caa');g.strokeStyle='#91a4bb';g.stroke();circle(move.x+joy.x*42,move.y+joy.y*42,28,'#9eb1c8aa');txt('MOVE',move.x,436,15);circle(dash.x,dash.y,dash.r,'#254564');g.strokeStyle='#60a5fa';g.stroke();txt(p.cd>0?p.cd.toFixed(1):'DASH',dash.x,dash.y+6,19,'#a5d5ff');circle(atk.x,atk.y,atk.r,p.attack>0?'#b35a44':'#78363d');g.strokeStyle='#f87171';g.stroke();txt('ATTACK',atk.x,atk.y+6,18);if(result){g.fillStyle='#0b1423d9';g.fillRect(0,0,W,H);txt(result.title,500,105,32,'#e8c46e');txt(result.rank,500,230,65);txt('KILLS '+p.k+'     TIME '+Math.floor(elapsed)+'s',500,305,23,'#b5c4d5')}}
function frame(t){let dt=Math.max(0,Math.min(.025,(t-last)/1000));last=t;if(scene==='play'&&!result)update(dt);draw();requestAnimationFrame(frame)}function point(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}function setJoy(p){let x=(p.x-move.x)/45,y=(p.y-move.y)/45,m=Math.max(1,Math.hypot(x,y));joy.x=x/m;joy.y=y/m}c.onpointerdown=e=>{e.preventDefault();if(scene!=='play'||result)return;let p=point(e);c.setPointerCapture(e.pointerId);if(Math.hypot(p.x-atk.x,p.y-atk.y)<atk.r+12)hit(units[0]);else if(Math.hypot(p.x-dash.x,p.y-dash.y)<dash.r+12)sprint(units[0]);else if(p.x<450&&p.y>200&&joy.id===null){joy.id=e.pointerId;setJoy(p)}};c.onpointermove=e=>{if(e.pointerId===joy.id)setJoy(point(e))};function release(e){if(e.pointerId===joy.id)joy={x:0,y:0,id:null}}c.onpointerup=release;c.onpointercancel=release;c.onlostpointercapture=release;window.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright',' ','shift'].includes(k))e.preventDefault();keys[k]=true;if(scene==='play'&&!result){if(k===' ')hit(units[0]);if(k==='shift'&&!e.repeat)sprint(units[0])}});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);window.addEventListener('blur',()=>{keys={};joy={x:0,y:0,id:null}});ui();requestAnimationFrame(frame);
</script></body></html>
